<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TimeBank – Prototipo interactivo</title>
<style>
:root{--p:#066F6A;--pd:#055753;--pl:#E6F3F2;--s:#EFA216;--sl:#FEF3D9;--t:#0F1F1E;--m:#6B7C7B;--l:#E3E9E8;--bg:#F4F7F7;--r:#D92D20;--g:#12805C}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#DDE6E5;color:var(--t);display:flex;min-height:100vh;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
#side{width:230px;background:#fff;border-right:1px solid var(--l);padding:14px;overflow:auto;height:100vh;position:sticky;top:0;flex:none}
#side h2{font-size:15px;color:var(--p);margin-bottom:8px}
#side h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--m);margin:14px 0 4px}
#side a{display:block;padding:5px 8px;border-radius:8px;font-size:13px;color:var(--t);cursor:pointer}
#side a:hover,#side a.on{background:var(--pl);color:var(--p)}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}
#phone{width:390px;height:844px;max-height:calc(100vh - 32px);background:#fff;border-radius:38px;box-shadow:0 0 0 9px #16211F,0 20px 50px #0004;position:relative;overflow:hidden;display:flex;flex-direction:column}
#sb{display:flex;justify-content:space-between;padding:12px 26px 6px;font-size:13px;font-weight:600;flex:none}
#scr{flex:1;overflow-y:auto;display:flex;flex-direction:column;position:relative}
.pg{padding:8px 20px 20px;flex:1}
.hd{display:flex;align-items:center;gap:8px;padding:6px 0 12px}
.hd h1{font-size:20px;font-weight:600;flex:1}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--bg)}
.ib.pri{background:var(--p);color:#fff}
.btn{width:100%;padding:13px;border-radius:12px;font-weight:600;background:var(--p);color:#fff;font-size:15px;margin-top:10px;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:active{filter:brightness(.9)}
.btn.sec{background:var(--s);color:#1b1300}
.btn.out{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.btn.red{background:var(--r)}
.btn.redo{background:#fff;color:var(--r);border:1.5px solid var(--r)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;margin:0;border-radius:10px}
.lnk{color:var(--p);font-size:13px;font-weight:500;text-align:center;display:block;width:100%;padding:10px}
.lnk.gr{color:var(--m);text-decoration:underline}
.f{display:block;margin-top:12px}
.f>span{display:block;font-size:13px;color:var(--m);margin-bottom:5px}
.f input,.f textarea,.f select,.inp{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;background:#fff;outline:0;font-size:14px}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pl)}
textarea{min-height:90px;resize:none}
.card{border:1px solid var(--l);border-radius:14px;padding:12px;margin-top:10px;background:#fff}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--pl);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.lg{width:84px;height:84px;font-size:26px;margin:0 auto}
.mu{color:var(--m);font-size:12px}
.b{font-weight:600}
.ttl{font-size:12px;font-weight:600;color:var(--m);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;background:var(--pl);color:var(--p);font-size:12px;font-weight:500;border:1px solid transparent;margin:0 4px 4px 0}
.chip.o{background:#fff;border-color:var(--l);color:var(--t)}
.chip.on{background:var(--p);color:#fff}
.bd{padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--sl);color:#8A5A00;white-space:nowrap}
.bd.g{background:#DDF5EA;color:var(--g)}.bd.r{background:#FDE7E5;color:var(--r)}.bd.b{background:var(--pl);color:var(--p)}.bd.m{background:var(--bg);color:var(--m)}
.tb{display:flex;justify-content:space-around;border-top:1px solid var(--l);padding:8px 4px 14px;flex:none;background:#fff;position:sticky;bottom:0}
.tb button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--m);flex:1}
.tb button.on{color:var(--p);font-weight:600}
.tabs{display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px solid var(--l);flex:none}
.tabs button{padding:11px 14px;font-size:13px;color:var(--m);white-space:nowrap}
.tabs button.on{color:var(--p);font-weight:600;box-shadow:inset 0 -2px var(--p)}
.hero{background:linear-gradient(135deg,var(--p),#0A8F89);color:#fff;border-radius:16px;padding:16px;margin-top:6px}
.hero .big{font-size:30px;font-weight:700;margin-top:4px}
.stat{flex:1;border:1px solid var(--l);border-radius:14px;padding:12px;background:var(--bg)}
.stat b{font-size:24px;display:block;margin-top:4px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin:8px 0}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:500;color:var(--m)}
.seg button.on{background:var(--p);color:#fff}
.sk .ic{width:36px;height:36px;border-radius:10px;background:var(--pl);color:var(--p);display:grid;place-items:center;flex:none}
.tog{width:46px;height:26px;border-radius:99px;background:#C9D3D2;position:relative;flex:none;transition:.2s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--p)}.tog.on:after{left:23px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--l);border-radius:12px;margin-top:8px;width:100%;text-align:left}
.opt i{width:18px;height:18px;border-radius:50%;border:2px solid #B7C4C3;flex:none}
.opt.sel{border-color:var(--p);background:var(--pl)}.opt.sel i{border-color:var(--p);background:radial-gradient(var(--p) 45%,transparent 50%)}
.list>.li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--l)}
.pos{color:var(--g);font-weight:700}.neg{color:var(--r);font-weight:700}
.bub{max-width:78%;padding:9px 13px;border-radius:16px;background:var(--bg);margin-top:8px;font-size:14px}
.bub.me{background:var(--p);color:#fff;margin-left:auto}
.stars{display:flex;gap:6px;justify-content:center;margin:18px 0;color:var(--s)}
.stars svg{fill:none;cursor:pointer}.stars svg.on{fill:var(--s)}
.up{border:2px dashed #9BC9C6;background:var(--pl);border-radius:16px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--p);width:100%;margin-top:10px;font-weight:500}
.up.done{border-style:solid;background:linear-gradient(135deg,#cfe8e6,#f4e6c4)}
.grid{display:grid;grid-template-columns:44px repeat(3,1fr);gap:5px;margin-top:10px;font-size:12px;align-items:center}
.grid .h{text-align:center;color:var(--m);font-weight:600}
.grid .c{height:34px;border-radius:8px;background:var(--bg);border:1px solid var(--l)}
.grid .c.on{background:var(--p);border-color:var(--p)}
.menu{display:none;border:1.5px solid var(--p);border-radius:10px;padding:4px;margin:4px 0 0 40px;background:#fff}
.menu.open{display:block}
.menu button{display:flex;gap:8px;align-items:center;padding:8px;width:100%;font-size:13px;border-radius:6px}
.menu button:hover{background:var(--pl)}
.bars{display:flex;align-items:flex-end;gap:14px;height:90px;padding:10px 6px 0}
.bars div{flex:1;background:var(--p);border-radius:4px 4px 0 0}
.bars div:nth-child(odd){background:var(--s)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#16211F;color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:9;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
.wel{background:linear-gradient(#fff 55%,var(--pl))}
@media(max-width:700px){#side{display:none}body{background:#fff}#stage{padding:0}#phone{width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none}}
</style>
</head>

const sk=(ic,t,s,go='habilidad-form')=>`<div class="card row sk" data-go="${go}"><div class="ic">${I(ic)}</div><div class="sp"><div class="b">${t}</div><div class="mu">${s}</div></div>${I('edit',18)}</div>`;

S.notif={g:'B',n:'Notificaciones',h:()=>`<div class="pg"><h1 style="font-size:20px;margin:6px 0">Notificaciones</h1><div class="list">${[['cal','Carlos aceptó tu solicitud de sesión','Hace 10 min','det-sesion'],['star','María te calificó con 5 estrellas','Hace 2 h','perfil'],['wal','Recibiste 1 crédito nuevo','Ayer','historial']].map(x=>`<div class="li row" data-go="${x[3]}" style="cursor:pointer"><span class="ib" style="background:var(--pl);color:var(--p)">${I(x[0],18)}</span><div class="sp"><div>${x[1]}</div><div class="mu">${x[2]}</div></div></div>`).join('')}</div></div>${tab('notif')}`};
S.mensajes={g:'B',n:'Mensajes',h:()=>`<div class="pg"><h1 style="font-size:20px;margin:6px 0">Mensajes</h1><div class="list">${[['MR','María Rodríguez','Claro, nos vemos a las 5','10:21'],['CP','Carlos Pérez','Perfecto, hablamos luego','Ayer']].map(x=>`<div class="li" data-go="chat" style="cursor:pointer">${av(x[0])}<div class="sp"><div class="b">${x[1]}</div><div class="mu">${x[2]}</div></div><span class="mu">${x[3]}</span></div>`).join('')}</div></div>${tab('mensajes')}`};
S.chat={g:'B',n:'Conversación',h:()=>`<div class="pg" style="display:flex;flex-direction:column"><div class="hd"><button class="ib" data-back>${I('back',22)}</button>${av('MR')}<h1 style="font-size:17px" data-go="perfil-publico">María Rodríguez</h1><button class="ib" data-go="reportar">${I('al',18)}</button></div><div id="msgs" style="flex:1"><div class="bub">Hola, ¿podemos vernos el martes?</div><div class="bub me">Sí, claro, a las 5pm</div><div class="bub">Perfecto, nos vemos</div></div><div class="row" style="margin-top:12px"><input id="mi" class="inp" style="border-radius:99px" placeholder="Escribe un mensaje..."><button class="ib pri" data-send>${I('send',18)}</button></div></div>`};
S.reportar={g:'B',n:'Reportar usuario',h:()=>`<div class="pg">${hd('Reportar usuario')}<div class="mu">Motivo</div>${rad(['Comportamiento inapropiado','No se presentó a la sesión','Contenido ofensivo'],0)}<label class="f"><textarea placeholder="Descripción (opcional)"></textarea></label>${B('Enviar reporte','mensajes','red','data-toast="Reporte enviado"')}</div>`};
S.historial={g:'B',n:'Historial de movimientos',h:()=>`<div class="pg">${hd('Historial')}<div class="list">${li('Clase con Carlos','+1','15 oct','pos')}${li('Sesión de inglés','−1','12 oct','neg')}${li('Donación al fondo','−2','8 oct','neg')}${li('Créditos de bienvenida','+2','1 oct','pos')}</div></div>`};
S.donar={g:'B',n:'Donar horas',h:()=>`<div class="pg">${hd('Donar horas')}<div style="text-align:center;color:var(--p);margin-top:6px">${I('heart',44)}</div><p class="mu" style="text-align:center;margin:10px 0">Tu saldo disponible es de 5 créditos</p><div class="row" style="justify-content:center;gap:24px;margin:14px 0"><button class="ib" style="border:1.5px solid var(--l);width:44px;height:44px" data-step="-1">−</button><b id="n" style="font-size:38px">2</b><button class="ib" style="border:1.5px solid var(--l);width:44px;height:44px" data-step="1">+</button></div>${B('Donar 2 créditos','billetera','','data-toast="¡Gracias por tu donación!" id="db"')}</div>`};
S.solidarias={g:'B',n:'Solicitar horas solidarias',h:()=>`<div class="pg">${hd('Horas solidarias')}<label class="f"><textarea placeholder="Cuéntanos tu motivo..." style="min-height:130px"></textarea></label>${F('Horas solicitadas','','number','2')}${B('Enviar solicitud','estado-sol','','data-toast="Solicitud enviada"')}</div>`};
S['estado-sol']={g:'B',n:'Estado de solicitud solidaria',h:()=>`<div class="pg">${hd('Mi solicitud')}<div class="row" style="justify-content:center;gap:12px;color:var(--s)">${I('hg',30)}<span class="bd">En revisión</span></div><div class="ttl">Motivo</div><div>Estoy sin empleo y necesito clases de inglés para una entrevista.</div><div class="ttl">Horas solicitadas</div><div>2 horas</div></div>`};
S.reportes={g:'B',n:'Bandeja de reportes (admin)',h:()=>`${at('reportes')}<div class="pg"><h1 style="font-size:20px">Reportes</h1>${[['Carlos P. reportó a Luis G.','Motivo: comportamiento inapropiado','Pendiente',''],['Ana T. reportó a Pedro M.','Motivo: no se presentó','Resuelto','g']].map(x=>`<div class="card" data-toast="Reporte abierto" style="cursor:pointer"><div class="row"><b class="sp" style="font-size:13px">${x[0]}</b><span class="bd ${x[3]}">${x[2]}</span></div><div class="mu" style="margin-top:4px">${x[1]}</div></div>`).join('')}</div>`};
S.disputas={g:'B',n:'Disputas (admin)',h:()=>`${at('disputas')}<div class="pg"><h1 style="font-size:20px">Disputas</h1><div class="card row"><div class="sp"><div class="b">Carlos P. vs. Jorge L.</div><div class="mu">Sesión del 9 oct · Python</div></div><button class="btn sm" data-toast="Disputa en revisión">Revisar</button></div></div>`};
S['aprobar-sol']={g:'B',n:'Aprobar horas solidarias (admin)',h:()=>`${at('aprobar-sol')}<div class="pg"><h1 style="font-size:20px">Horas solidarias</h1><div class="card"><div class="b">Luis Gómez · 2 horas</div><div class="mu" style="margin:4px 0 6px">“Estoy sin empleo y necesito clases de inglés para una entrevista.”</div><div class="row" style="gap:10px">${B('Rechazar','','out','style="flex:1" data-rm="Solicitud rechazada"')}${B('Aprobar','','','style="flex:1" data-rm="Solicitud aprobada"')}</div></div></div>`};

// ---------- ENGINE ----------
const scr=document.getElementById('scr'),ph=document.getElementById('phone'),tt=document.getElementById('toast');
let hist=[];
const toast=m=>{tt.textContent=m;tt.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>tt.classList.remove('show'),1800)};
function show(id){const s=S[id];if(!s)return;scr.innerHTML=s.h();scr.scrollTop=0;scr.style.display='flex';
 scr.firstElementChild&&(scr.children.length&&0);document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.id==id));document.title='TimeBank – '+s.n;
 const tb=scr.querySelector('.tb');if(tb){/* tabbar pegado abajo */}}
function go(id,push=true){if(push)hist.push(id);show(id);if(location.hash!=='#'+id)history.replaceState(null,'','#'+id)}
function back(){hist.pop();go(hist[hist.length-1]||'bienvenida',false)}
// sidebar
const G={A:'Persona A · Cuenta y admin',N:'Pantallas nuevas (Persona A)',B:'Persona B · Sesiones y créditos'};
document.getElementById('side').innerHTML='<h2>TimeBank</h2>'+['A','N','B'].map(k=>`<h3>${G[k]}</h3>`+Object.keys(S).filter(i=>S[i].g==k).map(i=>`<a data-id="${i}" onclick="go('${i}')">${S[i].n}</a>`).join('')).join('');
document.addEventListener('click',e=>{
 const q=s=>e.target.closest(s);let el;
 if(el=q('[data-rm]')){const c=el.closest('.card');toast(el.dataset.rm);c&&c.remove();return}
 if(el=q('[data-toast]')){toast(el.dataset.toast)}
 if(el=q('[data-back]'))return back();
 if(el=q('[data-tog]')){el.classList.toggle('on')}
 if(el=q('[data-tog2]')){el.classList.toggle('on');el.classList.toggle('o')}
 if(el=q('[data-sel]')){[...el.parentNode.children].forEach(c=>c.classList.remove('sel'));el.classList.add('sel');return}
 if(el=q('[data-seg]')){el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==el));scr.querySelectorAll('[data-p]').forEach(p=>p.hidden=p.dataset.p!=el.dataset.seg);return}
 if(el=q('[data-seg2]')){el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==el));return}
 if(el=q('[data-nv]')){el.parentNode.querySelectorAll('.chip').forEach(c=>{c.classList.toggle('on',c==el);c.classList.toggle('o',c!=el)});return}
 if(el=q('[data-tabs]')){el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==el));return}
 if(el=q('[data-f]')){el.parentNode.querySelectorAll('.chip').forEach(c=>{c.classList.toggle('on',c==el);c.classList.toggle('o',c!=el)});const k=el.textContent;scr.querySelectorAll('[data-k]').forEach(r=>r.style.display=(k=='Todas'||r.dataset.k==k||r.dataset.k=='Todas'&&0)?'':'none');return}
 if(el=q('[data-star]')){const n=+el.dataset.star;scr.querySelectorAll('[data-star]').forEach(s=>s.classList.toggle('on',+s.dataset.star<=n));return}
 if(el=q('[data-step]')){const n=document.getElementById('n');const v=Math.min(5,Math.max(1,+n.textContent+ +el.dataset.step));n.textContent=v;document.getElementById('db').textContent='Donar '+v+(v==1?' crédito':' créditos');return}
 if(el=q('[data-menu]')){const m=el.closest('.li').nextElementSibling;const o=m.classList.contains('open');scr.querySelectorAll('.menu').forEach(x=>x.classList.remove('open'));if(!o)m.classList.add('open');return}
 if(el=q('[data-susp]')){const r=el.closest('.menu').previousElementSibling.querySelector('[data-st]');const s=r.textContent=='Activo';r.textContent=s?'Suspendido':'Activo';r.className='bd '+(s?'m':'b');el.closest('.menu').classList.remove('open');toast(s?'Usuario suspendido':'Usuario reactivado');return}
 if(el=q('[data-up]')){el.classList.add('done');el.innerHTML=I('check',34)+'<span>documento_identidad.jpg</span>';return}
 if(el=q('[data-send]')){const i=document.getElementById('mi');if(i.value.trim()){const d=document.createElement('div');d.className='bub me';d.textContent=i.value;document.getElementById('msgs').appendChild(d);i.value=''}return}
 if(el=q('[data-addcat]')){document.getElementById('newcat').hidden=false;return}
 if(el=q('[data-savecat]')){const i=el.previousElementSibling;if(i.value.trim()){const d=document.createElement('div');d.className='li row card';d.style.margin='8px 0';d.innerHTML=`<div class="ib" style="background:var(--pl);color:var(--p)">${I('tag',18)}</div><div class="sp"><div class="b">${i.value}</div><div class="mu">0 habilidades</div></div><button class="ib" data-edcat>${I('edit',18)}</button><button class="ib" style="color:var(--r)" data-rm="Categoría eliminada">${I('trash',18)}</button>`;document.getElementById('cats').prepend(d);i.value='';document.getElementById('newcat').hidden=true;toast('Categoría creada')}return}
 if(el=q('[data-edcat]')){const b=el.closest('.card').querySelector('.b');const n=prompt('Nuevo nombre de la categoría',b.textContent);if(n){b.textContent=n;toast('Categoría actualizada')}return}
 if(el=q('[data-del]')){if(confirm('¿Eliminar tu cuenta definitivamente?')){toast('Cuenta eliminada');go('bienvenida')}return}
 if(el=q('[data-go]'))go(el.dataset.go);
});
go(S[location.hash.slice(1)]?location.hash.slice(1):'bienvenida');
</script>
</body>
</html>
